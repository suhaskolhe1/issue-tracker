name: CI/CD Pipeline

# Run this workflow every time code is pushed to the main branch or a PR is opened
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-build-and-test:
    runs-on: ubuntu-latest
    
    # We need a database to run our Spring Boot integration tests!
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: issuetracker
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up JDK 21
      uses: actions/setup-java@v3
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Build and Test Backend
      working-directory: ./issue-tracker-backend
      run: ./mvnw clean verify

  frontend-build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: './issue-tracker-frontend/package-lock.json'

    - name: Install Dependencies
      working-directory: ./issue-tracker-frontend
      run: npm ci

    - name: Build React App
      working-directory: ./issue-tracker-frontend
      run: npm run build
